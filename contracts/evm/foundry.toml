[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/contracts/"]
solc = "0.8.36"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
ffi = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
